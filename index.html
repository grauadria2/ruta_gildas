<!DOCTYPE html>                                                                                                                                                                                           
  <html lang="es">                                                                                                                                                                                          
  <head>                                  
  <meta charset="UTF-8">                                                                                                                                                                                    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">                                                                                                                                    
  <title>La Ruta de las Gildas</title>                                                                                                                                                                      
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">                                         
  <style>                                                   
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {                                                                                                                                                                                                 
      --ink: #1A1209; --cream: #F7F2E8; --gold: #C9943A;                                                                                                                                                    
      --gold-lt: #E8D5A0; --warm: #8A7F72;                                                                                                                                                                  
    }                                                                                                                                                                                                       
    html, body { height: 100%; background: var(--ink); color: var(--cream); font-family: 'DM Sans', sans-serif; font-weight: 300; }
    #s1 { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }                                                                                         
    .s1-top {                                                                                                                                                                                               
      width: 100%; flex: 1; display: flex; flex-direction: column;                                                                                                                                          
      align-items: center; justify-content: flex-end;                                                                                                                                                       
      padding-bottom: 2rem; border-bottom: 1px solid #2E2920;                                                                                                                                               
    }                                                                                                                                                                                                       
    .eyebrow { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 1.8rem; }                                                                                
    .s1-title { font-family: 'Playfair Display', serif; font-size: clamp(38px,8vw,64px); color: var(--cream); line-height: 1.05; text-align: center; }                                                      
    .s1-title em { font-style: italic; color: var(--gold); }                                                                                                                                                
    .s1-sub { margin-top: 1rem; font-size: 13px; color: var(--warm); letter-spacing: 0.5px; }
    .s1-bottom { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; padding: 2rem; }                                                   
    .field-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 280px; }                                                                                    
    .field-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--warm); }                                                                                                   
    input[type="text"], input[type="email"] {                                                                                                                                                               
      background: transparent; border: none; border-bottom: 1px solid #3A3020;                                                                                                                              
      color: var(--cream); font-family: 'DM Sans', sans-serif; font-size: 16px;                                                                                                                             
      font-weight: 300; padding: 8px 4px; text-align: center; outline: none; width: 100%;                                                                                                                   
    }                                                                                                                                                                                                       
    input::placeholder { color: #3A3020; }                                                                                                                                                                  
    input[type="date"] {                                                                                                                                                                                    
      background: transparent; border: none; border-bottom: 1px solid #3A3020;                                                                                                                              
      color: var(--cream); font-family: 'Playfair Display', serif; font-size: 22px;
      padding: 8px 4px; text-align: center; outline: none; cursor: pointer; width: 100%; color-scheme: dark;                                                                                                
    }                                                                                                                                                                                                       
    .btn-primary {                        
      background: var(--gold); color: var(--ink); border: none;                                                                                                                                             
      font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500;                                                                                                                                
      letter-spacing: 3px; text-transform: uppercase; padding: 16px 48px;                                                                                                                                   
      cursor: pointer; transition: background 0.2s;                                                                                                                                                         
    }                                                                                                                                                                                                       
    .btn-primary:hover { background: var(--gold-lt); }                                                                                                                                                      
    .btn-primary:disabled { opacity: 0.3; cursor: default; }                                                                                                                                                
    .five-dots { display: flex; gap: 8px; }                                                                                                                                                                 
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #2E2920; }
    .dot.gold { background: var(--gold); }                                                                                                                                                                  
  </style>                                                                                                                                                                                                  
  </head>
  <body>                                                                                                                                                                                                    
                                                            
  <div id="s1">                                                                                                                                                                                             
    <div class="s1-top">                                    
      <div class="eyebrow">Una aventura especial</div>                                                                                                                                                      
      <h1 class="s1-title">La Ruta<br>de las <em>Gildas</em></h1>
      <p class="s1-sub">5 paradas · Barcelona · Edición especial</p>                                                                                                                                        
    </div>                                                  
    <div class="s1-bottom">                   
      <div class="field-wrap">                                                                                                                                                                              
        <div class="field-label">Nombre de la persona</div>                                                                                                                                                 
        <input type="text" id="nombre" placeholder="Ej: Karmenchi">                                                                                                                                         
      </div>                                                                                                                                                                                                
      <div class="field-wrap">                                                                                                                                                                              
        <div class="field-label">Su email</div>                                                                                                                                                             
        <input type="email" id="email" placeholder="correo@ejemplo.com">
      </div>                                                                                                                                                                                                
      <div class="field-wrap">                                                                                                                                                                              
        <div class="field-label">¿Cuándo empieza la aventura?</div>
        <input type="date" id="fecha">                                                                                                                                                                      
      </div>                                                                                                                                                                                                
      <div class="five-dots">             
        <div class="dot"></div><div class="dot"></div>                                                                                                                                                      
        <div class="dot gold"></div>                                                                                                                                                                        
        <div class="dot"></div><div class="dot"></div>
      </div>                                                                                                                                                                                                
      <button class="btn-primary" id="btnEmpezar" disabled onclick="programar()">
        Programar la ruta                                                                                                                                                                                   
      </button>                               
    </div>                                                                                                                                                                                                  
  </div>                                                                                                                                                                                                    
                                                                                                                                                                                                            
  <script>                                                                                                                                                                                                  
  const WEBHOOK_PROGRAMAR = "https://n8n-adriagrau.onrender.com/webhook/programar-gildas";                                                                                                                  
                                                            
  const fechaInput = document.getElementById("fecha");
  const nombreInput = document.getElementById("nombre");
  const emailInput = document.getElementById("email");                                                                                                                                                      
  const btn = document.getElementById("btnEmpezar");
                                                                                                                                                                                                            
  function getLocalDate() {                                 
    const now = new Date();                                                                                                                                                                                 
    return now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +                                                                                                                                                   
      String(now.getDate()).padStart(2, "0");               
  }
  fechaInput.min = getLocalDate();                                                                                                                                                                          
                                          
  function checkForm() {                                                                                                                                                                                    
    btn.disabled = !(fechaInput.value && nombreInput.value && emailInput.value);                                                                                                                            
  }                                           
  fechaInput.addEventListener("change", checkForm);                                                                                                                                                         
  nombreInput.addEventListener("input", checkForm);         
  emailInput.addEventListener("input", checkForm);                                                                                                                                                          
                                          
  function formatDateES(d) {                                                                                                                                                                                
    const [y, m, day] = d.split("-");                                                                                                                                                                       
    return `${day}/${m}/${y}`;
  }                                                                                                                                                                                                         
                                                            
  function programar() {
    fetch(WEBHOOK_PROGRAMAR, {                                                                                                                                                                              
      method: "POST",
      headers: { "Content-Type": "application/json" },                                                                                                                                                      
      body: JSON.stringify({                                
        fecha: fechaInput.value,              
        nombre: nombreInput.value,        
        email: emailInput.value
      })                                                                                                                                                                                                    
    }).catch(e => console.warn("Error:", e));
                                                                                                                                                                                                            
    document.getElementById("s1").innerHTML = `             
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px;padding:40px;text-align:center;background:var(--ink);">
        <div style="font-size:56px;">🫒</div>                                                                                                                                                               
        <h2 style="font-family:'Playfair Display',serif;font-size:clamp(24px,6vw,40px);color:var(--cream);line-height:1.15;">
          ¡Ruta programada<br><em style="color:var(--gold);font-style:italic;">para el ${formatDateES(fechaInput.value)}!</em>                                                                              
        </h2>                                                                                                                                                                                               
        <p style="color:var(--warm);font-size:14px;line-height:1.7;max-width:300px;">                                                                                                                       
          En breve recibirá un email en <strong style="color:var(--cream);">${emailInput.value}</strong> con todos los detalles y un botón para el gran día.                                                
        </p>                                                                                                                                                                                                
        <div style="width:48px;height:1px;background:var(--gold);opacity:0.4;"></div>
        <p style="color:#3A3020;font-size:11px;letter-spacing:1px;">Con todo el cariño 🫒</p>                                                                                                               
      </div>                                                                                                                                                                                                
    `;                                                                                                                                                                                                      
  }                                                                                                                                                                                                         
  </script>                                                                                                                                                                                                 
  </body>                                     
  </html>
